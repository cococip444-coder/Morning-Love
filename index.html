<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selamat Pagi, Cintaku!</title>
<style>
body{margin:0;overflow:hidden;background:linear-gradient(180deg,#1b2d6b 0%,#4a78c2 35%,#ffb65a 75%,#fff3d4 100%);}
.scene,.msg{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh}
.hide{display:none}
.sun{position:absolute;bottom:-150px;left:50%;transform:translateX(-50%);width:180px;height:180px;border-radius:50%;background:#FFD84D;box-shadow:0 0 50px #ffd84d,0 0 120px #ffcc33,0 0 220px #ffb300;animation:sunrise 6s ease forwards;}
.mist{position:absolute;bottom:90px;left:-20%;width:140%;height:180px;background:rgba(255,255,255,.18);filter:blur(50px);animation:mist 8s ease-in-out infinite;}
@keyframes sunrise{0%{bottom:-200px;}100%{bottom:65%;}}
.cloud{position:absolute;width:220px;height:80px;background:white;border-radius:50px;opacity:.8;animation:cloud 30s linear infinite;}
.c1{top:80px;left:-250px;}
.c2{top:170px;left:-500px;animation-delay:6s;}
.c3{top:260px;left:-750px;animation-delay:12s;}
@keyframes cloud{0%{transform:translateX(0);}100%{transform:translateX(1800px);}}
.flowers{position:absolute;bottom:0;left:0;width:100%;height:180px;background:linear-gradient(to top,#2e8b57,#52b788,#86efac);border-top-left-radius:50% 40%;border-top-right-radius:50% 40%;z-index:1;}
.couple{width:260px;margin-top:25px;animation:float 4s ease-in-out infinite;}
button{padding:16px 40px;border:none;border-radius:50px;background:rgba(255,111,165,.85);color:white;font-size:20px;cursor:pointer;backdrop-filter:blur(15px);box-shadow:0 15px 35px rgba(0,0,0,.25);transition:.35s;}
button:hover{transform:scale(1.08);}
.photo{width:220px;height:auto;border-radius:20px;box-shadow:0 15px 35px rgba(0,0,0,.25);margin-bottom:20px;animation:float 4s ease-in-out infinite;}
.card{background:rgba(255,255,255,.88);backdrop-filter:blur(20px);padding:35px;border-radius:30px;max-width:520px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,.25);animation:popup .8s;}
@keyframes popup{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
@keyframes mist{0%,100%{transform:translateX(0);opacity:.4;}50%{transform:translateX(60px);opacity:.8;}}
</style>
<body>
<div class="scene" id="a">
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>
<div class="sun"></div>
<div class="mist"></div>
<div class="flowers"></div>
<h2>☀️ Selamat Pagi</h2>
<p>Aku Cinta Kamu di Pagi Hari 🌸</p>
<img src="couple.png" class="couple">
<button onclick="go()">Sentuh Aku 💗</button>
</div>
<div class="msg hide" id="b">
<div class="card">
<img src="foto-kita.jpg" class="photo">
<h1>Selamat Pagi, Cintaku!</h1>
<h2>Kamu Ganteng Hari Ini 💞</h2>
<h2>Jangan Lupa Mamam Yaa, Sayangnya Aku 💗</h2>
<h3>Walaupun Sekarang Kita Bejauhan, Tapi Cintamu Tetap Utuh DiHatiku ❤</h3>
<p>Sshhh... Fanni Lagi Mimpiin Mas!</p>
</div>
</div>
<script>
function go(){a.classList.add('hide');b.classList.remove('hide')}
</script>
</body></html>
